port: ":8080"
backendURL: "http://localhost:9090"
authToken: "your-secret-token"

routes:
  # 示例1：用户接口，带接口级别的认证 Hook
  - path: "/api/users"
    method: "POST"
    backendUrl: "http://localhost:9090"
    backendPath: "/v1/users"
    responseTransform:
      code: "200"
      userId: "$.data.id"
      userName: "$.data.name"
    # 接口级别的 Hook 配置
    hooks:
      # 认证前 Hook - 从 Header 中提取租户信息
      BeforeAuth: |
        if (context.requestHeaders.Authorization) {
          const token = context.requestHeaders.Authorization.replace('Bearer ', '');
          // 解析 token 并设置租户信息
          context.data.tenantId = "tenant-001";
          context.data.userId = "user-123";
          console.log("User tenant:", context.data.tenantId);
        }

      # 认证后 Hook - 记录认证成功日志
      AfterAuth: |
        console.log("User authenticated successfully:", context.data.userId);

      # 转发前 Hook - 添加自定义 Header
      BeforeForward: |
        context.requestHeaders["X-Tenant-ID"] = context.data.tenantId;
        context.requestHeaders["X-User-ID"] = context.data.userId;

  # 示例2：订单接口，带不同的 Hook 逻辑
  - path: "/api/orders"
    method: "POST"
    backendUrl: "http://localhost:9091"
    backendPath: "/orders"
    responseTransform:
      success: true
      orderId: "$.data.order_id"
      status: "$.data.status"
    hooks:
      # 订单接口的认证逻辑可能不同
      BeforeAuth: |
        // 订单接口需要额外的权限检查
        if (context.requestHeaders.Authorization) {
          const token = context.requestHeaders.Authorization.replace('Bearer ', '');
          context.data.userId = "user-123";
          context.data.role = "customer";

          // 检查用户角色
          if (context.data.role !== "customer" && context.data.role !== "admin") {
            throw new Error("Insufficient permissions");
          }
        }

      # 响应转换后 Hook - 记录订单创建日志
      AfterResponseTransform: |
        console.log("Order created:", context.responseBody);
        // 可以在这里发送通知、更新缓存等

  # 示例3：产品查询接口，只使用部分 Hook
  - path: "/api/products"
    method: "GET"
    backendUrl: "http://localhost:9092"
    backendPath: "/products"
    responseTransform:
      items:
        json.path: "$.data"
        id: "$.product_id"
        name: "$.product_name"
        price: "$.price"
    hooks:
      # 只使用 BeforeForward Hook 添加缓存控制
      BeforeForward: |
        context.requestHeaders["Cache-Control"] = "public, max-age=300";

      # 只使用 AfterForward Hook 记录响应时间
      AfterForward: |
        const duration = Date.now() - context.data.startTime;
        console.log("Product query took:", duration, "ms");

  # 示例4：没有接口级别 Hook 的接口，将使用全局 Hook
  - path: "/api/health"
    method: "GET"
    backendUrl: "http://localhost:9090"
    backendPath: "/health"
    # 没有 hooks 字段，将使用 main.go 中注册的全局 Hook
